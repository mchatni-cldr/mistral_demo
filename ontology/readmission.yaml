# Semantic layer for the mistral_demo readmission dataset.
#
# Source of truth. scripts/build_ontology.py validates every table, column and
# metric in here against the live warehouse, then renders the markdown that
# gets uploaded to Mistral. If a name drifts, the build fails loudly rather
# than shipping a document that quietly lies to the model.

domain: Hospital readmission risk
description: >-
  Inpatient admissions with the vitals, labs and clinical notes recorded during
  each stay, plus whether the patient was readmitted within 30 days of
  discharge. Used to analyse what drives avoidable readmissions.

entities:
  - name: Patient
    table: patients
    key: patient_id
    grain: One row per patient.
    description: A person who has had at least one inpatient admission.
    notable_columns:
      primary_condition: The patient's main chronic condition. Patient-level, not per-admission.
      age: Age in years at the time the dataset was generated.
      date_of_birth: DATE.

  - name: Admission
    table: admissions
    key: admission_id
    grain: One row per hospital admission. A patient can appear many times.
    description: A single inpatient stay, from admit through discharge.
    notable_columns:
      admitting_diagnosis: Reason for THIS admission. Usually matches the patient's primary_condition but is the correct column for per-admission analysis.
      readmitted_within_30d: BOOLEAN outcome. True if the patient was readmitted within 30 days of this discharge. This is ground truth.
      readmission_risk_flag: BOOLEAN prediction made at discharge. NOT the outcome - it is deliberately imperfect. Never use it as a substitute for readmitted_within_30d.
      follow_up_scheduled: BOOLEAN. Whether a follow-up appointment was booked before discharge.
      prior_admissions_90d: Count of this patient's admissions in the 90 days before this one.
      length_of_stay_days: Integer days. Equals DATEDIFF(discharge_date, admit_date).
      days_since_discharge: Days since this patient's previous discharge. NULL for a first admission.

  - name: Observation
    table: vitals_labs
    key: null
    grain: One row per measurement per admission.
    description: Vitals and lab results recorded during a stay.
    notable_columns:
      metric: Name of the measurement. Units differ per metric.
      value: DOUBLE. Only comparable within a single metric.
      abnormal: BOOLEAN. True if the value falls outside that metric's reference range.

  - name: ClinicalNote
    table: clinical_notes
    key: note_id
    grain: One row per note. Several notes per admission.
    description: Free-text clinical documentation written during the stay.
    notable_columns:
      note_type: Admission Note or Discharge Summary.
      note_text: Unstructured text. Search it with LIKE / ILIKE.

joins:
  - from: admissions.patient_id
    to: patients.patient_id
    cardinality: many-to-one
    note: The standard join for per-admission analysis broken down by patient attributes.
  - from: vitals_labs.admission_id
    to: admissions.admission_id
    cardinality: many-to-one
    note: Fans out. Aggregate the observations first, or count admissions with COUNT(DISTINCT admission_id).
  - from: clinical_notes.admission_id
    to: admissions.admission_id
    cardinality: many-to-one
    note: Fans out. Filter by note_type to get one row per admission.

metrics:
  - name: admissions_count
    description: Number of admissions.
    sql: COUNT(*)
    entity: admissions
  - name: patients_count
    description: Number of distinct patients.
    sql: COUNT(DISTINCT patient_id)
    entity: admissions
  - name: readmission_rate_30d
    description: Share of admissions followed by a readmission within 30 days. The headline metric.
    sql: ROUND(100 * AVG(CAST(readmitted_within_30d AS INT)), 1)
    entity: admissions
    unit: percent
  - name: follow_up_rate
    description: Share of admissions where a follow-up appointment was scheduled before discharge.
    sql: ROUND(100 * AVG(CAST(follow_up_scheduled AS INT)), 1)
    entity: admissions
    unit: percent
  - name: avg_length_of_stay
    description: Mean length of stay in days.
    sql: ROUND(AVG(length_of_stay_days), 1)
    entity: admissions
    unit: days
  - name: risk_flag_precision
    description: Of admissions flagged as high risk at discharge, the share actually readmitted.
    sql: ROUND(100 * SUM(CASE WHEN readmission_risk_flag AND readmitted_within_30d THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN readmission_risk_flag THEN 1 ELSE 0 END), 0), 1)
    entity: admissions
    unit: percent
  - name: risk_flag_recall
    description: Of admissions that were readmitted, the share the discharge flag caught.
    sql: ROUND(100 * SUM(CASE WHEN readmission_risk_flag AND readmitted_within_30d THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN readmitted_within_30d THEN 1 ELSE 0 END), 0), 1)
    entity: admissions
    unit: percent
  - name: abnormal_result_rate
    description: Share of recorded observations outside the reference range.
    sql: ROUND(100 * AVG(CAST(abnormal AS INT)), 1)
    entity: vitals_labs
    unit: percent

dimensions:
  - column: admitting_diagnosis
    entity: admissions
    enum_from: admissions.admitting_diagnosis
  - column: department
    entity: admissions
    enum_from: admissions.department
  - column: discharge_disposition
    entity: admissions
    enum_from: admissions.discharge_disposition
  - column: follow_up_scheduled
    entity: admissions
  - column: prior_admissions_90d
    entity: admissions
  - column: metric
    entity: vitals_labs
    enum_from: vitals_labs.metric
  - column: sex
    entity: patients
    enum_from: patients.sex

conventions:
  - name: Age bands
    rule: "Bucket patients.age as: under 50, 50-64, 65-79, 80+. Use these bands unless asked otherwise, so results are comparable between answers."
  - name: Month grain
    rule: "Group by month with TRUNC(admit_date, 'MM'). The data covers 2025-09 to 2026-08; monthly counts are ~90-130 admissions, so single-month differences are noisy."
  - name: Rates as percentages
    rule: "Express every rate as a percentage rounded to one decimal: ROUND(100 * AVG(CAST(bool_col AS INT)), 1). Never report a bare 0-1 fraction."
  - name: Minimum cohort size
    rule: "Report the row count alongside any rate. Below roughly 30 admissions a rate is not worth drawing a conclusion from - say so rather than ranking it."

patterns:
  - name: abnormal_results_per_admission
    description: Count abnormal observations per admission, then relate them to the outcome. The correct way to use vitals_labs without fanning out the admission rows.
    sql: |
      WITH ab AS (
        SELECT admission_id, SUM(CAST(abnormal AS INT)) AS n_abnormal
        FROM vitals_labs GROUP BY admission_id
      )
      SELECT CASE WHEN ab.n_abnormal >= 3 THEN '3+ abnormal' ELSE '0-2 abnormal' END AS band,
             COUNT(*) AS admissions,
             ROUND(100 * AVG(CAST(a.readmitted_within_30d AS INT)), 1) AS readmission_rate
      FROM admissions a JOIN ab ON a.admission_id = ab.admission_id
      GROUP BY 1 ORDER BY 1
  - name: risk_flag_confusion_matrix
    description: Raw counts behind risk_flag_precision and risk_flag_recall. Use this when asked how good the flag is, rather than reporting a single number.
    sql: |
      SELECT SUM(CASE WHEN readmission_risk_flag AND readmitted_within_30d THEN 1 ELSE 0 END) AS true_positive,
             SUM(CASE WHEN readmission_risk_flag AND NOT readmitted_within_30d THEN 1 ELSE 0 END) AS false_positive,
             SUM(CASE WHEN NOT readmission_risk_flag AND readmitted_within_30d THEN 1 ELSE 0 END) AS false_negative,
             SUM(CASE WHEN NOT readmission_risk_flag AND NOT readmitted_within_30d THEN 1 ELSE 0 END) AS true_negative
      FROM admissions
  - name: stratify_by_confounder
    description: Check whether an association survives controlling for prior admissions. Use this before claiming that follow-up scheduling causes lower readmission.
    sql: |
      SELECT prior_admissions_90d, follow_up_scheduled, COUNT(*) AS admissions,
             ROUND(100 * AVG(CAST(readmitted_within_30d AS INT)), 1) AS readmission_rate
      FROM admissions
      WHERE prior_admissions_90d <= 1
      GROUP BY prior_admissions_90d, follow_up_scheduled
      ORDER BY prior_admissions_90d, follow_up_scheduled
  - name: rate_by_age_band
    description: Readmission rate by the standard age bands, joining patient attributes to admissions.
    sql: |
      SELECT CASE WHEN p.age < 50 THEN 'under 50'
                  WHEN p.age < 65 THEN '50-64'
                  WHEN p.age < 80 THEN '65-79'
                  ELSE '80+' END AS age_band,
             COUNT(*) AS admissions,
             ROUND(100 * AVG(CAST(a.readmitted_within_30d AS INT)), 1) AS readmission_rate
      FROM admissions a JOIN patients p ON a.patient_id = p.patient_id
      GROUP BY 1 ORDER BY 1

analysis_notes:
  - "`follow_up_scheduled` is strongly associated with readmission, but follow-up is scheduled less often for patients who already have prior admissions. Stratify before implying causation - use the stratify_by_confounder pattern."
  - "The risk flag has far more false positives than true positives. Answering \"how accurate is it?\" with precision alone overstates it; give precision and recall together, or the confusion matrix."
  - "Monthly readmission rates move several points on 90-130 admissions. Do not narrate a month-to-month change as a trend."

gotchas:
  - "The grain of `admissions` is one row per ADMISSION, not per patient. Counting rows counts stays. Use COUNT(DISTINCT patient_id) for people."
  - "`readmission_risk_flag` is a prediction; `readmitted_within_30d` is what actually happened. Answer whether a patient was readmitted with the latter, always."
  - "Impala will not average a BOOLEAN. Cast it: AVG(CAST(col AS INT))."
  - "`vitals_labs.value` mixes units across metrics. Always filter to a single `metric` before averaging."
  - "Dates are real DATE columns. Use DATEDIFF(a, b) and plain literals like '2026-01-01'. No string casting needed."
  - "Joining `vitals_labs` or `clinical_notes` to `admissions` multiplies admission rows. Aggregate first, or use COUNT(DISTINCT admission_id)."
  - "`days_since_discharge` is NULL for a patient's first admission; that is expected, not missing data."
